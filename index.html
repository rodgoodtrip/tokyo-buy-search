<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tokyo buy search</title>
  <style>
    :root {
      --bg: #0f1117; --panel: #161922; --text: #e8eaed; --muted: #9aa0a6;
      --border: #2a2f3a; --accent: #6ea8fe; --green: #3dd68c; --red: #f07178;
      --star: #e8c547;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.4;
    }
    .wrap { max-width: 1480px; margin: 0 auto; padding: 20px 16px 48px; }
    h1 { font-size: 1.45rem; margin: 0; font-weight: 650; letter-spacing: -0.02em; }
    h2 { font-size: 1.05rem; margin: 18px 0 8px; font-weight: 600; }
    h3 { font-size: 0.95rem; margin: 16px 0 8px; font-weight: 600; }
    .sub { color: var(--muted); font-size: 0.88rem; margin: 6px 0 16px; max-width: 78ch; }
    .callout {
      background: color-mix(in srgb, var(--accent) 10%, var(--panel));
      border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--border));
      border-radius: 8px; padding: 10px 12px; font-size: 0.85rem; margin-bottom: 16px;
      color: var(--muted);
    }
    .callout strong { color: var(--text); }
    .nav { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 16px; }
    .nav button {
      background: var(--panel); color: var(--text); border: 1px solid var(--border);
      border-radius: 999px; padding: 6px 12px; font: inherit; cursor: pointer; font-size: 0.82rem;
    }
    .nav button.active { border-color: var(--accent); color: var(--accent); }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; margin-bottom: 14px; }
    @media (max-width: 800px) { .stats { grid-template-columns: repeat(2, 1fr); } }
    .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
    .stat b { display: block; font-size: 1.35rem; font-variant-numeric: tabular-nums; }
    .stat span { color: var(--muted); font-size: 0.75rem; }
    .filters { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: end; }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 0.72rem; color: var(--muted); }
    select, input, button.ghost {
      background: var(--panel); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 7px 10px; font: inherit;
    }
    button.ghost { cursor: pointer; }
    button.ghost:hover, .nav button:hover { border-color: var(--accent); color: var(--accent); }
    .table-wrap {
      overflow: auto; max-height: min(70vh, 820px);
      border: 1px solid var(--border); border-radius: 8px; background: var(--panel);
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th, td { padding: 7px 9px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th {
      background: #12151d; position: sticky; top: 0; z-index: 2;
      text-align: left; cursor: pointer; user-select: none; font-weight: 500; color: var(--muted);
    }
    th:hover, th.sorted { color: var(--accent); }
    th.sorted { font-weight: 650; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    tr:hover td { background: rgba(110,168,254,0.05); }
    tr.starred td { background: rgba(61,214,140,0.07); }
    tr.struck td { opacity: 0.45; text-decoration: line-through; }
    tr.struck td:first-child, tr.struck td:nth-child(2) { text-decoration: none; opacity: 1; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .name { color: var(--muted); font-size: 0.72rem; margin-top: 2px; }
    .pill {
      display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 0.68rem;
      background: #12151d; border: 1px solid var(--border); text-transform: capitalize;
    }
    .acts { display: inline-flex; gap: 2px; }
    .acts button {
      width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent;
      color: var(--muted); cursor: pointer; font-size: 0.95rem; line-height: 1;
    }
    .acts button:hover { background: rgba(255,255,255,0.06); color: var(--text); }
    .acts button.on-star { color: var(--star); }
    .acts button.on-x { color: var(--red); }
    .empty {
      padding: 18px; color: var(--muted); font-size: 0.9rem;
      border: 1px dashed var(--border); border-radius: 8px; margin-top: 8px;
    }
    .notes { margin-top: 22px; color: var(--muted); font-size: 0.84rem; max-width: 78ch; }
    .notes h2 { color: var(--text); }
    .hdr { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
    .badge { font-size: 0.7rem; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px; }
    .ward-block { margin-top: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hdr">
      <h1 id="pageTitle">Tokyo buy search</h1>
      <span class="badge" id="badgeDate"></span>
      <span class="badge" id="badgeFx"></span>
    </div>
    <nav id="searchNav" class="nav" aria-label="Searches"></nav>
    <p class="sub" id="pageSub"></p>
    <div class="callout" id="pageCallout"></div>

    <div class="stats" id="stats">
      <div class="stat"><b id="sView">0</b><span>In this view</span></div>
      <div class="stat"><b id="sTotal">0</b><span>Total in dataset</span></div>
      <div class="stat"><b id="sStar">0</b><span>Starred</span></div>
      <div class="stat"><b id="sActive">0</b><span>Not yet reviewed</span></div>
    </div>

    <div class="filters" id="filters">
      <label>View
        <select id="fView">
          <option value="active">Active (hide starred and struck)</option>
          <option value="starred">Starred only</option>
          <option value="struck">Struck only</option>
          <option value="all">All</option>
        </select>
      </label>
      <label id="labTrack">Track
        <select id="fTrack">
          <option value="all">Solo and joint</option>
          <option value="joint">Joint (2+ rooms)</option>
          <option value="solo">Solo (1 room)</option>
        </select>
      </label>
      <label id="labBeds">Bedrooms
        <select id="fBeds">
          <option value="all">2+ bedrooms</option>
          <option value="3">3+ bedrooms</option>
          <option value="2">2 bedrooms</option>
        </select>
      </label>
      <label>Type
        <select id="fKind">
          <option value="all">House and condo</option>
          <option value="house">House</option>
          <option value="condo">Condo</option>
        </select>
      </label>
      <label id="labLine">Line
        <select id="fLine"><option value="all">All lines</option></select>
      </label>
      <label id="labArea">Area
        <select id="fArea"><option value="all">All areas</option></select>
      </label>
      <label>Search
        <input id="fSearch" placeholder="station, area, title…" style="min-width:200px" />
      </label>
      <button class="ghost" id="btnReset" type="button">Reset filters</button>
      <button class="ghost" id="btnLoadSeed" type="button">Load Rod’s shortlist</button>
      <button class="ghost" id="btnExport" type="button">Export shortlist</button>
      <button class="ghost" id="btnClearMarks" type="button">Clear my stars/strikes</button>
    </div>

    <div id="listView">
      <div id="starredSection" hidden>
        <h2>Starred</h2>
        <div class="table-wrap"><table id="starTbl"><thead></thead><tbody></tbody></table></div>
      </div>
      <h2 id="mainTitle">Active listings</h2>
      <div id="emptyMsg" class="empty" hidden></div>
      <div class="table-wrap"><table id="mainTbl"><thead></thead><tbody></tbody></table></div>
    </div>

    <div id="wardView" hidden></div>

    <div class="notes">
      <h2>Notes</h2>
      <p id="notes"></p>
    </div>
  </div>
  <script>
    const SEARCHES = [
      {
        id: "wards",
        label: "23 wards",
        file: "data/wards.json",
        title: "Tokyo 23 wards under $600k",
        updated: "2026-11-17",
        fx: "¥159.10/$",
        sub: "Median asking price of used condos built in 1982 or later, at or under $600k. Airport times sit on the ward, from one central station.",
        callout: "Each median is the middle of Suumo’s first six pages under ¥100M after the 1982 and $600k cuts. In central wards that is the stock Suumo surfaces first, not a census of the ward.",
        notes: "Built is the completion year-month. Renovated is the oldest dated reform on the Suumo page, blank when none is listed. HND and NRT minutes are weekday 10:00 Yahoo times on 18 Nov 2026.",
        mode: "wards"
      },
      {
        id: "nov",
        label: "Tokyo / Yokohama",
        file: "data/nov.json",
        title: "Tokyo / Yokohama — Nov 2026",
        updated: "2026-11-17",
        fx: "¥159.10/$",
        sub: "Same bands as August: solo 1-room ≤ $150k, joint 2+ rooms ≤ $300k, walk ≤ 20 min, built 1982 or later.",
        callout: "Further Suumo pages, cheap end and the top of the cap. Listings that redirect to Suumo’s building archive are removed.",
        notes: "Built is the completion year-month. Renovated is the oldest dated reform on the Suumo page, blank when none is listed. FX is the 17 Nov 2026 Bank of Japan rate.",
        track: true,
        area: true,
        sortKey: "tokyo",
        cols: ["track","kind","title","priceUSD","monthlyUSD","sqm","pricePerSqm","trueCostPerSqm","beds","baths","built","reno","walk","tokyo","haneda","narita","area","station"]
      },
      {
        id: "shinjuku",
        label: "Shinjuku",
        file: "data/shinjuku.json",
        title: "Shinjuku ≤ $600k",
        updated: "2026-11-17",
        fx: "¥159.10/$",
        sub: "Shinjuku ward. 2+ bedrooms, 3+ ranked above 2, 1.5 baths ranked above 1. Built 1982 or later. Times to Haneda and Narita.",
        callout: "Cap $600k. One-bath homes stay in the list. Condos under 40 m² are left out.",
        notes: "Built is the completion year-month. Renovated is the oldest dated reform on the Suumo page, blank when none is listed.",
        beds: true,
        sortKey: "priority",
        sortDir: "desc",
        cols: ["kind","title","priceUSD","monthlyUSD","sqm","pricePerSqm","trueCostPerSqm","beds","baths","built","reno","walk","haneda","narita","station"]
      },
      {
        id: "ueno",
        label: "Ueno / Taito",
        file: "data/ueno.json",
        title: "Ueno / Taito ≤ $600k",
        updated: "2026-11-17",
        fx: "¥159.10/$",
        sub: "Taito ward (Ueno). 2+ bedrooms, 3+ ranked above 2, 1.5 baths ranked above 1. Time to Narita only.",
        callout: "Cap $600k. Built 1982 or later. One-bath homes stay in the list.",
        notes: "Built is the completion year-month. Renovated is the oldest dated reform on the Suumo page, blank when none is listed.",
        beds: true,
        sortKey: "priority",
        sortDir: "desc",
        cols: ["kind","title","priceUSD","monthlyUSD","sqm","pricePerSqm","trueCostPerSqm","beds","baths","built","reno","walk","narita","area","station"]
      },
      {
        id: "osaka",
        label: "Osaka",
        file: "data/osaka.json",
        title: "Osaka — Kansai airport",
        updated: "2026-11-17",
        fx: "¥159.10/$",
        sub: "Osaka city. Solo 1-room ≤ $150k, joint 2+ rooms ≤ $300k, walk ≤ 20 min, built 1982 or later. Times to Osaka station and Kansai airport.",
        callout: "Same price bands as the Tokyo search. Airport minutes are to KIX, not Haneda or Narita.",
        notes: "Built is the completion year-month. Renovated is the oldest dated reform on the Suumo page, blank when none is listed.",
        track: true,
        area: true,
        sortKey: "kix",
        cols: ["track","kind","title","priceUSD","monthlyUSD","sqm","pricePerSqm","trueCostPerSqm","beds","baths","built","reno","walk","osaka","kix","area","station"]
      },
      {
        id: "august",
        label: "August 2026",
        file: "data/august.json",
        title: "Tokyo / Yokohama — August 2026",
        updated: "2026-08-26",
        fx: "¥158.88/$",
        sub: "The original owner-occupy list, kept so those prices stay as they were. Solo 1-room and joint 2+ rooms.",
        callout: "Stars and strikes on this view stay in this browser. Export shortlist downloads a proposal against Rod’s baked-in seed.",
        notes: "Transit minutes from Yahoo乗換案内 (weekday ~10:00): →新宿 via Shinjuku; →HND and →NRT are the airports. This snapshot is the August canvas and is not refreshed.",
        seed: true,
        track: true,
        line: true,
        sortKey: "tokyo",
        cols: ["track","kind","title","priceUSD","monthlyUSD","sqm","pricePerSqm","trueCostPerSqm","walk","tokyo","haneda","narita","line","station"]
      }
    ];

    const COL = {
      track: { k: "track", label: "Track" },
      kind: { k: "kind", label: "Type" },
      title: { k: "title", label: "Listing" },
      priceUSD: { k: "priceUSD", label: "Price", num: true },
      monthlyUSD: { k: "monthlyUSD", label: "Fees/mo", num: true },
      sqm: { k: "sqm", label: "Size", num: true },
      pricePerSqm: { k: "pricePerSqm", label: "$/m²", num: true },
      trueCostPerSqm: { k: "trueCostPerSqm", label: "True $/m²", num: true },
      beds: { k: "beds", label: "Beds", num: true },
      baths: { k: "baths", label: "Baths", num: true },
      built: { k: "built", label: "Built" },
      reno: { k: "reno", label: "Renovated" },
      walk: { k: "walk", label: "Walk", num: true },
      tokyo: { k: "tokyo", label: "→新宿", num: true },
      haneda: { k: "haneda", label: "→HND", num: true },
      narita: { k: "narita", label: "→NRT", num: true },
      osaka: { k: "osaka", label: "→大阪", num: true },
      kix: { k: "kix", label: "→KIX", num: true },
      line: { k: "line", label: "Line" },
      area: { k: "area", label: "Area" },
      station: { k: "station", label: "Station" }
    };

    const AUGUST_SEED = {"starred":["1393798","20978202","1405758","21350089","21119463","21167281","21447583","21106326","20547924","21260603","20333395","1393751","21052623","21144313","78728821","20916771","20906655","21337104","1393766","21492335","1393811"],"struck":["21105313","21103311","77143949","20762309","21005495","74972987","21430055","21099632","21431461","1408271","1313382"],"view":"active","track":"solo","kind":"condo","line":"all","sortKey":"tokyo","sortDir":"asc"};

    const dataCache = {};
    let search = SEARCHES[0];
    let rows = [];
    let state = null;

    function storeKey(id) {
      return id === "august" ? "tokyo-buy-search-v2" : "tokyo-buy-search-v3:" + id;
    }
    function loadState(id) {
      try { return JSON.parse(localStorage.getItem(storeKey(id)) || "null"); } catch { return null; }
    }
    function saveState() {
      localStorage.setItem(storeKey(search.id), JSON.stringify({
        view: state.view, track: state.track, kind: state.kind, line: state.line,
        area: state.area, beds: state.beds, q: state.q,
        sortKey: state.sortKey, sortDir: state.sortDir,
        starred: state.starred, struck: state.struck, seededFrom: state.seededFrom || null
      }));
    }
    function defaultsFor(s) {
      return {
        view: "active", track: "all", kind: "all", line: "all", area: "all", beds: "all", q: "",
        sortKey: s.sortKey || "priceUSD", sortDir: s.sortDir || "asc",
        starred: [], struck: [], seededFrom: null
      };
    }
    function applyAugustSeed(base) {
      return Object.assign({}, base, {
        starred: [...AUGUST_SEED.starred],
        struck: [...AUGUST_SEED.struck],
        view: AUGUST_SEED.view,
        track: AUGUST_SEED.track,
        kind: AUGUST_SEED.kind,
        line: AUGUST_SEED.line,
        sortKey: AUGUST_SEED.sortKey,
        sortDir: AUGUST_SEED.sortDir,
        seededFrom: "rod-canvas"
      });
    }
    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function usd(n) {
      if (n == null || Number.isNaN(Number(n))) return "—";
      return "$" + Math.round(Number(n) / 1000) + "k";
    }
    function fee(n) { return n ? ("$" + n + "/mo") : "$0"; }
    function pps(n) { return n == null ? "—" : ("$" + Number(n).toLocaleString() + "/m²"); }
    function mins(n) { return (n == null || Number.isNaN(Number(n))) ? "—" : (n + "m"); }

    function columns() {
      return [{ k: "_acts", label: "" }, { k: "_i", label: "#" }].concat((search.cols || []).map((k) => COL[k]));
    }

    function fillSelect(sel, values, allLabel) {
      const current = sel.value;
      sel.innerHTML = "";
      const all = document.createElement("option");
      all.value = "all";
      all.textContent = allLabel;
      sel.appendChild(all);
      values.forEach((v) => {
        const o = document.createElement("option");
        o.value = v;
        o.textContent = v;
        sel.appendChild(o);
      });
      if ([...sel.options].some((o) => o.value === current)) sel.value = current;
    }

    function showChrome() {
      document.getElementById("pageTitle").textContent = search.title;
      document.getElementById("badgeDate").textContent = search.updated;
      document.getElementById("badgeFx").textContent = search.fx;
      document.getElementById("pageSub").textContent = search.sub;
      document.getElementById("pageCallout").innerHTML = "<strong>" + esc(search.label) + ".</strong> " + esc(search.callout);
      document.getElementById("notes").textContent = search.notes;
      document.getElementById("labTrack").hidden = !search.track;
      document.getElementById("labBeds").hidden = !search.beds;
      document.getElementById("labLine").hidden = !search.line;
      document.getElementById("labArea").hidden = !search.area;
      document.getElementById("btnLoadSeed").hidden = !search.seed;
      document.getElementById("filters").hidden = search.mode === "wards";
      document.getElementById("stats").hidden = search.mode === "wards";
      document.getElementById("listView").hidden = search.mode === "wards";
      document.getElementById("wardView").hidden = search.mode !== "wards";
      document.querySelectorAll("#searchNav button").forEach((b) => {
        b.classList.toggle("active", b.dataset.id === search.id);
      });
      document.title = search.title;
    }

    function syncFilters() {
      document.getElementById("fView").value = state.view;
      document.getElementById("fTrack").value = state.track;
      document.getElementById("fKind").value = state.kind;
      document.getElementById("fBeds").value = state.beds || "all";
      document.getElementById("fLine").value = state.line || "all";
      document.getElementById("fArea").value = state.area || "all";
      document.getElementById("fSearch").value = state.q || "";
    }

    function baseFilters(r) {
      if (search.track && state.track !== "all" && r.track !== state.track) return false;
      if (state.kind !== "all" && r.kind !== state.kind) return false;
      if (search.beds && state.beds === "3" && (r.beds || 0) < 3) return false;
      if (search.beds && state.beds === "2" && r.beds !== 2) return false;
      if (search.line && state.line !== "all") {
        const line = String(r.line || "");
        if (state.line === "Keio Sag" && !line.startsWith("Keio Sag")) return false;
        else if (state.line === "Sotetsu" && !line.startsWith("Sotetsu")) return false;
        else if (state.line === "Odakyu" && !(line === "Odakyu" || line.startsWith("Odakyu "))) return false;
        else if (state.line === "Keio" && !(line === "Keio" || line.startsWith("Keio "))) return false;
        else if (!["Keio Sag", "Sotetsu", "Odakyu", "Keio"].includes(state.line) && line !== state.line && !line.startsWith(state.line)) return false;
      }
      if (search.area && state.area !== "all" && r.area !== state.area) return false;
      if (state.q) {
        const hay = [r.title, r.name, r.line, r.area, r.station, r.built].join(" ").toLowerCase();
        if (!hay.includes(state.q.toLowerCase())) return false;
      }
      return true;
    }
    function viewFilter(r) {
      const starred = state.starred.includes(r.id);
      const struck = state.struck.includes(r.id);
      if (state.view === "active") return !starred && !struck;
      if (state.view === "starred") return starred;
      if (state.view === "struck") return struck;
      return true;
    }
    function sortRows(items) {
      const sign = state.sortDir === "asc" ? 1 : -1;
      const k = state.sortKey;
      return [...items].sort((a, b) => {
        const av = a[k];
        const bv = b[k];
        if (av == null && bv == null) return (a.walk || 999) - (b.walk || 999);
        if (av == null) return 1;
        if (bv == null) return -1;
        const cmp = (typeof av === "string" || typeof bv === "string")
          ? String(av).localeCompare(String(bv))
          : (av - bv);
        if (cmp !== 0) return sign * cmp;
        return (a.walk || 999) - (b.walk || 999);
      });
    }

    function theadHtml() {
      return "<tr>" + columns().map((c) => {
        if (c.k.startsWith("_")) return "<th>" + c.label + "</th>";
        const sorted = state.sortKey === c.k;
        const arrow = sorted ? (state.sortDir === "asc" ? " ↑" : " ↓") : "";
        return `<th data-k="${c.k}"${sorted ? ' class="sorted"' : ""}>${c.label}${arrow}</th>`;
      }).join("") + "</tr>";
    }
    function cellHtml(r, col, i) {
      const k = col.k;
      if (k === "_acts") {
        const isStar = state.starred.includes(r.id);
        const isStruck = state.struck.includes(r.id);
        return `<td><div class="acts">
          <button type="button" data-act="star" class="${isStar ? "on-star" : ""}">${isStar ? "★" : "☆"}</button>
          <button type="button" data-act="strike" class="${isStruck ? "on-x" : ""}">${isStruck ? "+" : "✕"}</button>
        </div></td>`;
      }
      if (k === "_i") return `<td class="num">${i + 1}</td>`;
      if (k === "title") {
        const name = r.name ? `<div class="name">${esc(r.name)}</div>` : "";
        return `<td><a href="${esc(r.href)}" target="_blank" rel="noopener">${esc(r.title)}</a>${name}</td>`;
      }
      if (k === "priceUSD") return `<td class="num">${usd(r.priceUSD)}</td>`;
      if (k === "monthlyUSD") return `<td class="num">${fee(r.monthlyUSD || 0)}</td>`;
      if (k === "sqm") return `<td class="num">${r.sqm != null ? esc(r.sqm) + " m²" : "—"}</td>`;
      if (k === "pricePerSqm" || k === "trueCostPerSqm") return `<td class="num">${pps(r[k])}</td>`;
      if (k === "walk" || k === "tokyo" || k === "haneda" || k === "narita" || k === "osaka" || k === "kix") return `<td class="num">${mins(r[k])}</td>`;
      if (k === "track" || k === "kind") return `<td><span class="pill">${esc(r[k] || "—")}</span></td>`;
      if (k === "station") return `<td>${r.station === "—" ? "see listing" : esc(r.station)}</td>`;
      if (k === "beds" || k === "baths") return `<td class="num">${r[k] == null ? "—" : esc(r[k])}</td>`;
      return `<td class="${col.num ? "num" : ""}">${r[k] == null || r[k] === "" ? "—" : esc(r[k])}</td>`;
    }
    function rowHtml(r, i) {
      const cls = state.starred.includes(r.id) ? "starred" : (state.struck.includes(r.id) ? "struck" : "");
      return `<tr class="${cls}" data-id="${esc(r.id)}">` + columns().map((c) => cellHtml(r, c, i)).join("") + "</tr>";
    }
    function bindTable(table) {
      table.tHead.innerHTML = theadHtml();
      table.tHead.querySelectorAll("th[data-k]").forEach((th) => {
        th.onclick = () => {
          const k = th.dataset.k;
          if (state.sortKey === k) state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
          else {
            state.sortKey = k;
            state.sortDir = (k === "beds" || k === "baths" || k === "sqm" || k === "built" || k === "reno") ? "desc" : "asc";
          }
          saveState();
          renderList();
        };
      });
      table.tBodies[0].onclick = (e) => {
        const btn = e.target.closest("button[data-act]");
        if (!btn) return;
        const id = btn.closest("tr").dataset.id;
        if (btn.dataset.act === "star") {
          const will = !state.starred.includes(id);
          state.starred = will ? state.starred.concat(id) : state.starred.filter((x) => x !== id);
          if (will) state.struck = state.struck.filter((x) => x !== id);
        } else {
          const will = !state.struck.includes(id);
          state.struck = will ? state.struck.concat(id) : state.struck.filter((x) => x !== id);
          if (will) state.starred = state.starred.filter((x) => x !== id);
        }
        saveState();
        renderList();
      };
    }

    function renderList() {
      const filtered = rows.filter((r) => baseFilters(r) && viewFilter(r));
      const sorted = sortRows(filtered);
      const favorites = sortRows(rows.filter((r) => state.starred.includes(r.id) && baseFilters(r)));
      document.getElementById("sView").textContent = sorted.length;
      document.getElementById("sTotal").textContent = rows.length;
      document.getElementById("sStar").textContent = state.starred.length;
      document.getElementById("sActive").textContent = rows.filter((r) => !state.starred.includes(r.id) && !state.struck.includes(r.id)).length;
      const titles = { active: "Active listings", starred: "Starred", struck: "Struck", all: "All listings" };
      document.getElementById("mainTitle").textContent = titles[state.view] || "Listings";
      const starSec = document.getElementById("starredSection");
      const showStar = favorites.length > 0 && state.view !== "starred";
      starSec.hidden = !showStar;
      if (showStar) {
        const st = document.getElementById("starTbl");
        bindTable(st);
        st.tBodies[0].innerHTML = favorites.map(rowHtml).join("");
      }
      const mt = document.getElementById("mainTbl");
      bindTable(mt);
      mt.tBodies[0].innerHTML = sorted.map(rowHtml).join("");
      const empty = document.getElementById("emptyMsg");
      if (!sorted.length) {
        empty.hidden = false;
        empty.textContent = state.view === "starred"
          ? "No starred listings yet."
          : "Nothing matches these filters.";
      } else empty.hidden = true;
    }

    function renderWards(wards) {
      const ranked = [...wards].sort((a, b) => b.medianUSD - a.medianUSD);
      const cheapest = [...wards].sort((a, b) => a.medianUSD - b.medianUSD)[0];
      const mid = ranked[Math.floor(ranked.length / 2)];
      const head = `<div class="stats">
        <div class="stat"><b>${usd(ranked[0].medianUSD)}</b><span>Highest median · ${esc(ranked[0].ward)}</span></div>
        <div class="stat"><b>${usd(cheapest.medianUSD)}</b><span>Lowest median · ${esc(cheapest.ward)}</span></div>
        <div class="stat"><b>${usd(mid.medianUSD)}</b><span>Middle ward · ${esc(mid.ward)}</span></div>
        <div class="stat"><b>23</b><span>Wards</span></div>
      </div>
      <h2>Median asking price by ward</h2>
      <div class="table-wrap"><table><thead><tr>
        <th>Ward</th><th>Sample</th><th>Median</th><th>P25</th><th>P75</th><th>Median $/m²</th><th>2+ rooms</th><th>From</th><th>→HND</th><th>→NRT</th>
      </tr></thead><tbody>
      ${ranked.map((w) => `<tr>
        <td>${esc(w.ward)}</td>
        <td class="num">${w.sampleN}</td>
        <td class="num">${usd(w.medianUSD)}</td>
        <td class="num">${usd(w.p25USD)}</td>
        <td class="num">${usd(w.p75USD)}</td>
        <td class="num">$${Number(w.medianPerSqm).toLocaleString()}</td>
        <td class="num">${Math.round(w.familyShare)}%</td>
        <td>${esc(w.station)}</td>
        <td class="num">${w.haneda}m</td>
        <td class="num">${w.narita}m</td>
      </tr>`).join("")}
      </tbody></table></div>
      <h2>Listings by ward</h2>`;
      const blocks = ranked.map((w) => `<section class="ward-block">
        <h3>${esc(w.ward)} · median ${usd(w.medianUSD)} · HND ${w.haneda}m from ${esc(w.station)} · NRT ${w.narita}m</h3>
        <div class="table-wrap"><table><thead><tr>
          <th>Listing</th><th>Price</th><th>Beds</th><th>Size</th><th>Walk</th><th>Built</th><th>Renovated</th><th>Station</th>
        </tr></thead><tbody>
        ${(w.listings || []).map((r) => `<tr>
          <td><a href="${esc(r.href)}" target="_blank" rel="noopener">${esc(r.title)}</a>${r.name ? `<div class="name">${esc(r.name)}</div>` : ""}</td>
          <td class="num">${usd(r.priceUSD)}</td>
          <td class="num">${r.beds == null ? "—" : r.beds}</td>
          <td class="num">${r.sqm != null ? esc(r.sqm) + " m²" : "—"}</td>
          <td class="num">${mins(r.walk)}</td>
          <td>${esc(r.built || r.year || "—")}</td>
          <td>${esc(r.reno || "—")}</td>
          <td>${esc(r.station || "—")}</td>
        </tr>`).join("")}
        </tbody></table></div>
      </section>`).join("");
      document.getElementById("wardView").innerHTML = head + blocks;
    }

    async function loadSearch(id, push) {
      const next = SEARCHES.find((s) => s.id === id) || SEARCHES.find((s) => s.id === "august");
      if (state && search) saveState();
      search = next;
      if (push) history.replaceState(null, "", "#" + search.id);
      showChrome();
      if (!dataCache[search.id]) {
        const res = await fetch(search.file);
        if (!res.ok) throw new Error("Could not load " + search.file);
        dataCache[search.id] = await res.json();
      }
      let saved = loadState(search.id);
      if (search.id === "august" && !saved) saved = applyAugustSeed(defaultsFor(search));
      state = Object.assign(defaultsFor(search), saved || {});
      state.starred = Array.isArray(state.starred) ? state.starred.filter((x) => typeof x === "string") : [];
      state.struck = Array.isArray(state.struck) ? state.struck.filter((x) => typeof x === "string") : [];
      if (search.mode === "wards") {
        renderWards(dataCache[search.id]);
        return;
      }
      rows = dataCache[search.id];
      rows.forEach((r) => { r.priority = (r.beds || 0) * 10 + (r.baths || 0); });
      if (search.line) {
        fillSelect(document.getElementById("fLine"), [...new Set(rows.map((r) => r.line).filter(Boolean))].sort(), "All lines");
      }
      if (search.area) {
        fillSelect(document.getElementById("fArea"), [...new Set(rows.map((r) => r.area).filter(Boolean))].sort(), "All areas");
      }
      syncFilters();
      saveState();
      renderList();
    }

    function bootNav() {
      const nav = document.getElementById("searchNav");
      SEARCHES.forEach((s) => {
        const b = document.createElement("button");
        b.type = "button";
        b.dataset.id = s.id;
        b.textContent = s.label;
        b.onclick = () => loadSearch(s.id, true);
        nav.appendChild(b);
      });
    }

    ["fView", "fTrack", "fKind", "fLine", "fArea", "fBeds"].forEach((id) => {
      document.getElementById(id).addEventListener("change", (e) => {
        const map = { fView: "view", fTrack: "track", fKind: "kind", fLine: "line", fArea: "area", fBeds: "beds" };
        state[map[id]] = e.target.value;
        saveState();
        renderList();
      });
    });
    document.getElementById("fSearch").addEventListener("input", (e) => {
      state.q = e.target.value;
      saveState();
      renderList();
    });
    document.getElementById("btnReset").onclick = () => {
      const fresh = defaultsFor(search);
      state.view = fresh.view; state.track = fresh.track; state.kind = fresh.kind;
      state.line = fresh.line; state.area = fresh.area; state.beds = fresh.beds; state.q = "";
      syncFilters(); saveState(); renderList();
    };
    document.getElementById("btnLoadSeed").onclick = () => {
      if (!search.seed) return;
      if (!confirm("Replace your local stars, strikes, and filters on the August list with Rod’s shortlist?")) return;
      Object.assign(state, applyAugustSeed(state));
      state.q = "";
      syncFilters(); saveState(); renderList();
    };
    document.getElementById("btnClearMarks").onclick = () => {
      if (!confirm("Clear stars and strikes for this search in this browser?")) return;
      state.starred = []; state.struck = []; state.seededFrom = null;
      saveState(); renderList();
    };
    document.getElementById("btnExport").onclick = () => {
      const seed = {
        search: search.id,
        starred: state.starred, struck: state.struck,
        view: state.view, track: state.track, kind: state.kind, line: state.line,
        area: state.area, beds: state.beds, sortKey: state.sortKey, sortDir: state.sortDir
      };
      const baseStar = new Set(search.seed ? AUGUST_SEED.starred : []);
      const baseStruck = new Set(search.seed ? AUGUST_SEED.struck : []);
      const nextStar = new Set(seed.starred);
      const nextStruck = new Set(seed.struck);
      const changes = {
        starredAdded: [...nextStar].filter((x) => !baseStar.has(x)).sort(),
        starredRemoved: [...baseStar].filter((x) => !nextStar.has(x)).sort(),
        struckAdded: [...nextStruck].filter((x) => !baseStruck.has(x)).sort(),
        struckRemoved: [...baseStruck].filter((x) => !nextStruck.has(x)).sort()
      };
      const proposal = {
        format: "tokyo-buy-search-shortlist-v1",
        search: search.id,
        createdAt: new Date().toISOString(),
        comparedTo: search.seed ? "page-seed (Rod baseline on the August list)" : search.id,
        changes, seed
      };
      const stamp = new Date().toISOString().slice(0, 10);
      const blob = new Blob([JSON.stringify(proposal, null, 2) + "\n"], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `${search.id}-shortlist-${stamp}.json`;
      a.click();
      URL.revokeObjectURL(a.href);
    };

    window.addEventListener("hashchange", () => {
      const id = location.hash.replace("#", "") || "august";
      if (id !== search.id) loadSearch(id, false);
    });

    bootNav();
    const start = location.hash.replace("#", "") || "august";
    if (new URLSearchParams(location.search).get("seed") === "1" && (start === "august" || start === "")) {
      localStorage.setItem(storeKey("august"), JSON.stringify(applyAugustSeed(defaultsFor(SEARCHES.find((s) => s.id === "august")))));
    }
    loadSearch(SEARCHES.some((s) => s.id === start) ? start : "august", true).catch((err) => {
      document.getElementById("pageSub").textContent = String(err.message || err);
    });
  </script>
</body>
</html>
